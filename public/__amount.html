<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>AmountInput</title>
<script type="module">
import React, { useState, useEffect, useRef } from "https://esm.sh/react@18.3.1";
import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";
const h = React.createElement;

// ==== COPIA EXACTA del componente de App.jsx ====
const AmountInput = ({ value, onChange, style, placeholder = "0,00", ...rest }) => {
  const toText = (v) => (v == null || v === "" ? "" : String(v).replace(".", ","));
  const [text, setText] = useState(() => toText(value));
  const editing = useRef(false);
  useEffect(() => { if (!editing.current) setText(toText(value)); }, [value]);
  const handle = (raw) => {
    let s = raw.replace(/[^\d.,]/g, "").replace(/\./g, ",");
    const i = s.indexOf(",");
    if (i >= 0) s = s.slice(0, i + 1) + s.slice(i + 1).replace(/,/g, "").slice(0, 2);
    setText(s);
    if (s === "" || s === ",") { onChange(null); return; }
    const n = parseFloat(s.replace(",", "."));
    onChange(Number.isFinite(n) ? n : null);
  };
  return h("input", { ...rest, value: text, placeholder, inputMode: "decimal", style,
    onFocus: () => { editing.current = true; },
    onBlur: () => { editing.current = false; setText(toText(value)); },
    onChange: (e) => handle(e.target.value) });
};
// ================================================

function Demo() {
  const [v, setV] = useState(null);
  return h("div", null,
    h("input", { id: "amt", value: undefined, style: { display: "none" } }),
    h(AmountInput, { value: v, onChange: setV, id: "campo",
      style: { fontSize: 18, padding: 8, width: 200, fontFamily: "monospace" } }),
    h("div", { id: "num", style: { marginTop: 8, fontFamily: "monospace" } }, "valor guardado: " + JSON.stringify(v)),
    h("button", { id: "ext", onClick: () => setV(99.5), style: { marginTop: 8 } }, "Cambiar desde fuera a 99.5")
  );
}
createRoot(document.getElementById("root")).render(h(Demo));
window.__ready = true;
</script>
<style>body{font-family:system-ui;padding:20px}</style>
</head><body><div id="root"></div></body></html>
