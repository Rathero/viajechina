<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Prueba calendario</title>
<style>
body{font-family:system-ui,sans-serif;background:#EDF1F4;color:#0B2239;padding:24px;margin:0}
.card{background:#fff;border:1px solid #DCE4EA;border-radius:16px;padding:18px;max-width:420px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:10px;font-weight:700;color:#5B6B78}
button{height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:12.5px;border:none;cursor:pointer;font-family:inherit}
h3{font-weight:800;font-size:14px;margin:0 0 8px}
.leg{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid #DCE4EA;font-size:11.5px;color:#5B6B78}
.leg span.sw{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px}
.note{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11px;color:#5B6B78}
</style></head><body>
<div class="card">
  <h3>Septiembre 2026</h3>
  <div class="grid" style="margin-bottom:4px">
    <div class="dow">L</div><div class="dow">M</div><div class="dow">X</div><div class="dow">J</div>
    <div class="dow">V</div><div class="dow">S</div><div class="dow">D</div>
  </div>
  <div class="grid" id="g"></div>
  <div class="leg" id="leg"></div>
  <div class="note">
    <span style="width:16px;height:10px;border-radius:3px;background:linear-gradient(90deg,#5B6B7855 0 50%,#5B6B78 50% 100%);flex-shrink:0"></span>
    Día de cambio de ciudad: a la izquierda de la que sales, a la derecha donde duermes.
  </div>
</div>
<script>
// Mismos colores y misma lógica que la app
const CITIES = [
  {id:'c1',city:'Tokio',color:'#0B2239',days:['05','06','07','08','09','10']},
  {id:'c2',city:'Hakone',color:'#1CA6A6',days:['10','11','12']},
  {id:'c3',city:'Takayama',color:'#FF5A3C',days:['12','13','14']},
  {id:'c4',city:'Kanazawa',color:'#C9962E',days:['14','15','16']},
  {id:'c5',city:'Kioto',color:'#3D6FA6',days:['16','17','18','19','20','21']},
  {id:'c6',city:'Hiroshima',color:'#7E5BA6',days:['21','22','23']},
  {id:'c7',city:'Osaka',color:'#C0603A',days:['23','24','25']},
];
const dateCities = {};
CITIES.forEach(c => c.days.forEach(d => {
  const iso = '2026-09-' + d;
  const arr = dateCities[iso] || (dateCities[iso] = []);
  if (!arr.some(x => x.id === c.id)) arr.push({id:c.id, color:c.color, city:c.city});
}));

const g = document.getElementById('g');
const off = (new Date(Date.UTC(2026,8,1)).getUTCDay() + 6) % 7;
for (let i=0;i<off;i++) g.appendChild(document.createElement('div'));
for (let d=1; d<=30; d++) {
  const iso = `2026-09-${String(d).padStart(2,'0')}`;
  const cs = dateCities[iso] || [];
  const on = cs.length > 0;
  const bg = !on ? 'transparent'
    : cs.length === 1 ? cs[0].color
    : `linear-gradient(90deg, ${cs.map((c,i)=>`${c.color} ${(i*100)/cs.length}% ${((i+1)*100)/cs.length}%`).join(', ')})`;
  const b = document.createElement('button');
  b.textContent = d;
  b.title = on ? cs.map(c=>c.city).join(' → ') : '';
  b.style.background = bg;
  b.style.color = on ? '#fff' : '#AAB8C2';
  b.style.fontWeight = on ? 700 : 500;
  b.style.textShadow = cs.length > 1 ? '0 0 3px rgba(0,0,0,0.45)' : 'none';
  g.appendChild(b);
}
document.getElementById('leg').innerHTML = CITIES.map(c =>
  `<span><span class="sw" style="background:${c.color}"></span>${c.city}</span>`).join('');
console.log('Días partidos:', Object.values(dateCities).filter(a=>a.length>1).length);
</script>
</body></html>
