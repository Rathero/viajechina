<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Reservas</title>
<style>
body{font-family:system-ui,sans-serif;background:#EDF1F4;color:#0B2239;padding:16px;margin:0}
.wrap{max-width:400px;margin:0 auto}
.row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #DCE4EA;border-radius:12px;padding:12px 16px;margin-bottom:8px}
.row.conf{border-color:#1CA6A666}
.cb{width:20px;height:20px;border-radius:6px;border:1.5px solid #DCE4EA;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.cb.on{background:#1CA6A6;border-color:#1CA6A6;color:#fff;font-size:13px;font-weight:900}
.t{font-size:14px;font-weight:700}
.cat{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#5B6B78}
.dot{width:7px;height:7px;border-radius:99px;flex-shrink:0}
.sub{font-size:11.5px;color:#5B6B78}
.meals{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:4px}
.pill{font-size:10px;font-weight:700;color:#1CA6A6;background:#1CA6A61A;border:1px solid #1CA6A644;border-radius:99px;padding:1px 7px}
.ind{display:flex;align-items:center;gap:10px;margin-top:4px}
.price{font-family:ui-monospace,monospace;font-size:11px;color:#E23B1E;font-weight:700}
.chip{font-size:10px;font-weight:700;color:#1CA6A6;background:#1CA6A61A;border:1px solid #1CA6A655;border-radius:99px;padding:2px 7px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#5B6B78;margin:16px 0 8px;display:flex;gap:6px;align-items:center}
svg{display:block}
</style></head><body><div class="wrap">
<h3>Hoteles</h3>
<div id="list"></div>
</div>
<script>
const UTENSILS='<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#1CA6A6" stroke-width="2" stroke-linecap="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>';
const CHECK='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>';
const data=[
 {t:"Hotel Gracery Shinjuku",cat:"Alojamiento",sub:"5 sep → 10 sep · 5 noches · Doble con desayuno",meals:["Desayuno"],price:"¥127.000 · €681,45",paid:true,conf:true},
 {t:"Ryokan en Hakone",cat:"Alojamiento",sub:"10 sep → 12 sep · 2 noches · Cena kaiseki y desayuno",meals:["Desayuno","Cena"],price:"¥97.000 · €520,47",paid:true,conf:true},
 {t:"Hotel en Takayama",cat:"Alojamiento",sub:"12 sep → 14 sep · 2 noches · Doble tradicional",meals:["Desayuno"],price:"¥45.000 · €241,45",paid:false,conf:false},
 {t:"Machiya en Gion (Kioto)",cat:"Alojamiento",sub:"16 sep → 21 sep · 5 noches · Casa entera",meals:[],price:"¥145.000 · €778,00",paid:true,conf:true},
 {t:"Hotel en Namba (Osaka)",cat:"Alojamiento",sub:"23 sep → 25 sep · 2 noches",meals:[],price:"¥43.000 · €230,72",paid:false,conf:false},
];
document.getElementById('list').innerHTML=data.map(b=>`
 <div class="row${b.conf?' conf':''}">
   <div class="cb${b.conf?' on':''}">${b.conf?CHECK:''}</div>
   <div style="flex:1;min-width:0">
     <div class="t">${b.t}</div>
     <div class="cat"><span class="dot" style="background:#FF5A3C"></span>${b.cat}</div>
     <div class="sub">${b.sub}</div>
     ${b.meals.length?`<div class="meals">${UTENSILS}${b.meals.map(m=>`<span class="pill">${m}</span>`).join('')}</div>`:''}
     <div class="ind"><span class="price">${b.price}</span>${b.paid?'<span class="chip">✓ Pagado</span>':''}</div>
   </div>
 </div>`).join('');
</script></body></html>
